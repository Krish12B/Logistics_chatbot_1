[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-chatbot"
version = "1.0.0"
description = "FleetHarbor Logistics AI Chatbot backend using ChromaDB, Supabase PostgreSQL, pgvector, and Groq LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "sentence-transformers>=3.0.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "chromadb>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["logistics_chatbot*", "shipment_chatbot*"]

