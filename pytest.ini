[pytest]
testpaths = tests
pythonpath = src
addopts = -v --tb=short
asyncio_default_fixture_loop_scope = function
markers =
    unit: fast isolated unit tests
    integration: integration tests using SQLite or temporary ChromaDB
    api: FastAPI TestClient endpoint and contract tests
    e2e: Playwright headless browser end-to-end tests
    slow: long-running question bank or performance tests
    live: tests requiring live external API credentials
